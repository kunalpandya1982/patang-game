*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#24145A; --ink-soft:#4E4290; --paper:#FFFFFF; --mist:#EEF7FF; --lilac:#EFEAFF;
  --rani:#EE1F80; --kesari:#FF8A1F; --peelo:#FFC93C; --leelo:#1FB35C; --firozi:#12BFC9; --jaambli:#6D41D6;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --gu:"Baloo Bhai 2","Noto Sans Gujarati","Gujarati Sangam MN","Gujarati MT","Shruti",ui-rounded,system-ui,sans-serif;
  --show:"Farsan","Baloo Bhai 2","Noto Sans Gujarati","Gujarati Sangam MN",cursive;
}
html,body{margin:0;height:100%;overflow:hidden;background:#1592E6;color:var(--ink);
  font-family:var(--gu);font-weight:600;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
canvas#sky,canvas#fx{position:fixed;left:0;top:0;display:block}
#sky{z-index:0}
#fx{z-index:40;pointer-events:none}
:focus-visible{outline:4px solid var(--kesari);outline-offset:3px}

/* ---------- HUD ---------- */
#hud{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px);pointer-events:none}
#hud>*{pointer-events:auto}
#hud .grow{flex:1;pointer-events:none}
.round{width:48px;height:48px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--paper);
  box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .07s,box-shadow .07s}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.round svg{width:24px;height:24px}
.pill{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 14px 0 8px;border:3px solid var(--ink);
  border-radius:999px;background:var(--paper);box-shadow:0 4px 0 var(--ink);font-weight:800;font-size:20px;white-space:nowrap}
.pill svg{width:26px;height:26px}
.pill.sm{height:40px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.pill.sm svg{width:22px;height:22px}
#who canvas{width:28px;height:35px}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.2)}}

/* ---------- Logo (title) ---------- */
#logo{position:fixed;z-index:5;left:50%;top:calc(var(--st) + 58px);transform:translateX(-50%) rotate(-5deg);
  text-align:center;pointer-events:none;transition:opacity .3s}
#logo .g{font-family:var(--show);font-size:clamp(88px,27vw,168px);line-height:.92;color:#fff;
  text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink),0 10px 0 var(--ink)}
#logo .r{display:inline-block;margin-top:10px;font-weight:800;font-size:20px;letter-spacing:.02em;background:var(--peelo);
  border:3px solid var(--ink);border-radius:999px;padding:0 16px;box-shadow:0 4px 0 var(--ink);transform:rotate(6deg)}

/* ---------- Dock + cards ---------- */
#dock{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:0 calc(var(--sr) + 12px) calc(var(--sb) + 14px) calc(var(--sl) + 12px);pointer-events:none}
#dock .card{pointer-events:auto}
.card{width:100%;max-width:540px;max-height:calc(100vh - var(--st) - 96px);max-height:calc(100dvh - var(--st) - 96px);overflow:auto;
  background:var(--paper);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);padding:16px;position:relative;
  -webkit-user-select:none;user-select:none;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
.card.in{animation:cardIn .42s cubic-bezier(.2,1.35,.35,1) both}
@keyframes cardIn{from{transform:translateY(70px) rotate(-2deg);opacity:0}}
.card.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.say{margin:2px 0 8px;font-size:clamp(23px,6.2vw,29px);line-height:1.08;font-weight:800;letter-spacing:-.01em}
.center{text-align:center}
.sub{font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1.25}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.headrow .say{margin:0}
.roman{font-weight:700;color:var(--ink-soft);font-size:18px;line-height:1.15}
.roman.lg{font-size:22px}
.en{font-weight:600;color:var(--ink-soft);font-size:16px;line-height:1.2;margin-top:2px}
.gu{font-family:var(--gu)}
.tip{margin:10px 2px 0;font-size:17px;line-height:1.25;color:var(--ink-soft);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:6px 20px;border:3px solid var(--ink);

.tag{display:inline-block;font-size:14px;font-weight:800;color:#fff;background:var(--jaambli);border-radius:999px;padding:0 10px;margin-bottom:2px}

/* result + rewards */

/* title */
.flyers{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.mini{font:inherit;font-size:15px;font-weight:800;border:3px solid var(--ink);border-radius:999px;background:#fff;min-height:40px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}

/* workshop */

  box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center}

.color{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0}

/* mission + gate + grown-ups */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

.pad .btn{font-size:26px;min-height:58px;padding:0}
.linkbtn{display:block;margin:14px auto 0;font:inherit;font-size:16px;font-weight:800;background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:6px}

/* microphone: the child records, Mithu copies */
.microw{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 2px}
.mic{position:relative;width:76px;height:76px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--rani);box-shadow:0 5px 0 var(--ink);
  display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .07s,box-shadow .07s,background .15s;--lv:0}
.mic:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mic svg{width:34px;height:34px}
.mic::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--peelo);opacity:0;transform:scale(calc(1 + var(--lv) * .35));transition:transform .06s,opacity .15s;pointer-events:none}
.mic.on{background:var(--leelo)}
.mic.on::before{opacity:1}
.mic.sm{width:46px;height:46px;box-shadow:0 3px 0 var(--ink)}
.mic.sm svg{width:22px;height:22px}
.mic.sm::before{inset:-6px;border-width:4px}
.miclab{font-size:17px;font-weight:800;color:var(--ink-soft);line-height:1.2;max-width:210px}
.round.sm{width:40px;height:40px;box-shadow:0 3px 0 var(--ink)}
.round.sm svg{width:18px;height:18px}
.pill canvas{width:22px;height:28px}
.microw.have{gap:10px;flex-wrap:wrap}
.microw .linkbtn{display:inline;margin:0;padding:6px 4px}
.vtick{width:40px;height:40px;flex:none;border-radius:50%;background:var(--leelo);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:22px;font-weight:800;line-height:1}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.choice .btn{min-height:46px;font-size:17px;padding:4px 8px}
.updatebtn{position:fixed;z-index:50;left:50%;top:calc(var(--st) + 68px);transform:translateX(-50%);min-height:46px;font-size:17px;white-space:nowrap}

.timer.hurry i{background:var(--rani)}

.cheer{margin-top:6px}
.cheer .gu{font-size:22px;font-weight:800;line-height:1.15;color:var(--leelo)}
.cheer .roman{font-size:16px}
.cheer .en{font-size:14px}
.rtbar{height:12px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin:6px 0 10px}
.rtbar i{display:block;height:100%;width:0;background:var(--leelo);transition:width .3s}
.mic.off{background:#B7B0D8}
.mic.off svg{opacity:.85}
.flyer .btn.rec{min-height:48px;font-size:17px;padding:4px 10px;gap:6px;box-shadow:0 4px 0 var(--ink)}
.flyer .btn.rec svg{width:22px;height:22px}
.vlist li{gap:8px;padding:6px 8px 6px 12px}
.vlist li.sel{border-color:var(--rani);background:#FFF0F6;box-shadow:0 0 0 2px var(--rani)}
.vpick{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:0;padding:2px 0;margin:0;cursor:pointer;font:inherit;color:inherit}
.vpick .gu{font-size:23px;font-weight:800;line-height:1.15}
.vpick .r{font-size:16px;font-weight:700;color:var(--ink-soft);line-height:1.2}
.vpick .r b{color:var(--leelo)}
.done{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800;font-size:19px;color:var(--leelo);margin:12px 0 0}
.set{border-top:2px dashed rgba(36,20,90,.25);padding:12px 0}
.set .sl{font-size:15px;font-weight:800;color:var(--ink-soft);margin-bottom:6px}
.set .sv2{font-size:17px;font-weight:700;line-height:1.25}
.set .note{margin:0;font-size:16px;line-height:1.35;font-weight:600}
.weeks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wk{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:6px 10px;text-align:left;cursor:pointer;line-height:1.15}
.wk b{display:block;font-size:17px}
.wk span{font-size:14px;color:var(--ink-soft);font-weight:700}
.wk.sel{background:#FFF0BF;outline:3px solid var(--rani)}
.set.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.howto{margin:4px 0 12px;padding-left:22px;font-size:16px;line-height:1.35;font-weight:700;color:var(--ink-soft)}
.sheets{display:grid;gap:8px}
.sheet{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.sheet:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.sheet .sn{width:34px;height:34px;flex:none;border-radius:50%;background:var(--peelo);border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:17px}
.sheet .st{flex:1;display:flex;flex-direction:column;line-height:1.15}
.sheet .st b{font-size:17px}
.sheet .st span{font-size:14px;color:var(--ink-soft);font-weight:700}
.sheet.full .sn{background:var(--leelo);color:#fff}

.prompter li.has{border-color:var(--leelo)}

.prompter .w{flex:1;display:flex;flex-direction:column;min-width:0}
.prompter .w .gu{font-size:27px;font-weight:800;line-height:1.15}
.prompter .w .r{font-size:18px;font-weight:700;color:var(--ink-soft);line-height:1.2}

/* bubbles, burst, toast, flying spools */
.bubble{position:fixed;z-index:25;left:0;top:0;max-width:240px;padding:7px 14px 8px;background:var(--paper);border:3px solid var(--ink);
  border-radius:20px;box-shadow:0 4px 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .2s;--tail:70%}
.bubble.on{opacity:1}
.bubble .g{font-size:25px;font-weight:800;line-height:1.1}
.bubble .r{font-size:15px;font-weight:700;color:var(--ink-soft)}
.bubble::before,.bubble::after{content:"";position:absolute;left:var(--tail);width:0;height:0;border:11px solid transparent}
.bubble.down::before{bottom:-22px;border-top-color:var(--ink)}
.bubble.down::after{bottom:-16px;border-top-color:#fff}
.bubble.up::before{top:-22px;border-bottom-color:var(--ink)}
.bubble.up::after{top:-16px;border-bottom-color:#fff}
#burst{position:fixed;z-index:45;left:50%;top:33%;pointer-events:none;text-align:center;opacity:0;transform:translate(-50%,-50%)}
#burst .g{display:block;font-family:var(--show);font-size:clamp(60px,17vw,124px);line-height:1;color:var(--peelo);white-space:nowrap;
  text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),3px 3px var(--ink),-3px -3px var(--ink),3px -3px var(--ink),-3px 3px var(--ink),0 10px 0 var(--ink)}
#burst .r{display:inline-block;margin-top:8px;font-size:22px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:2px 16px}
#burst.go{animation:burst 1.7s cubic-bezier(.2,1.5,.35,1) both}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-14deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(4deg)}
  40%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}78%{opacity:1;transform:translate(-50%,-52%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-64%) scale(.94)}}
#toast{position:fixed;z-index:35;left:50%;top:calc(var(--st) + 72px);transform:translate(-50%,-16px);opacity:0;background:var(--ink);color:#fff;
  padding:7px 18px 8px;border-radius:999px;font-weight:800;font-size:18px;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:41;left:0;top:0;width:26px;height:26px;pointer-events:none;will-change:transform}
.fly svg{width:26px;height:26px}

@media (min-width:700px){ .card{padding:20px} .judge{margin:16px -20px -20px} }
@media (prefers-reduced-motion:reduce){
  .card.in,.card.shake,.road .track i.pop,.bump{animation:none}
  #burst.go{animation:burstR 1.4s both}
  @keyframes burstR{0%,100%{opacity:0}15%,80%{opacity:1}}
}

// One recording per unique line: the key is the Gujarati text without punctuation or spaces.
function voiceKey(gu) { return String(gu || '').replace(/[\s?!.,…'"’‘\-–—\/:;()]/g, ''); }
// "હું થાકી ગયો / ગઈ" holds two forms; each is recorded and played on its own.
function sayParts(line) {
  const g = String(line.gu || ''), r = String(line.roman || '');
  if (!g.includes(' / ')) return [{ gu: g, roman: r }];
  const gp = g.split(' / '), rp = r.split(' / '), g0 = gp[0].trim(), r0 = (rp[0] || '').trim(), out = [{ gu: g0, roman: r0 }];
  for (let i = 1; i < gp.length; i++) {
    const gw = g0.split(' '), rw = r0.split(' ');
    gw[gw.length - 1] = gp[i].trim(); rw[rw.length - 1] = (rp[i] || '').trim();
    out.push({ gu: gw.join(' '), roman: rw.join(' ') });
  }
  return out;
}
// Recording sheets in reading order; a line already on an earlier sheet is never asked for twice.
function buildSheets() {
  const seen = new Set(), sheets = [];
  const add = (sheet, line) => { for (const p of sayParts(line)) { const k = voiceKey(p.gu); if (!k || seen.has(k)) continue; seen.add(k); sheet.lines.push({ key: k, gu: p.gu, roman: p.roman }); } };
  const first = { id: 's1', name: 'Mithu and friends', lines: [] };
  [MITHU.kemcho, MITHU.majama, GREET_BIG, MITHU.teach, MITHU.vaah, MITHU.again, MITHU.kaipo, MITHU.chalo, MITHU.aavjo, POKES[4]].concat(TAUNTS, [ESCAPE, JALDI], COUNT.slice().reverse(), ENCOURAGE).forEach(l => add(first, l));
  sheets.push(first);
  WEEKS.forEach((wk, i) => {
    const sh = { id: 's' + (i + 2), name: 'Week ' + wk.week + ': ' + wk.theme, lines: [] };
    wk.little.forEach(l => add(sh, l));
    wk.big.forEach(b => { add(sh, b.q); add(sh, b.a); });
    sheets.push(sh);

// ---------- a session: greet, teach Mithu, battles, rewards ----------
function buildSession(who) {
  const wk = WEEKS[S.week - 1], Fy = S.flyers[who];
  const pool = who === 'little' ? wk.little : wk.big, nTeach = who === 'little' ? 3 : 2;
  const fresh = pool.filter(w => !Fy.learned.includes(w.id));
  let teach = fresh.slice(0, nTeach);
  if (teach.length < nTeach) teach = teach.concat(shuffle(pool.filter(w => !teach.includes(w))).slice(0, nTeach - teach.length));
  let battles;
  if (who === 'little') battles = shuffle(teach);
  else battles = shuffle(teach.concat(shuffle(pool.filter(w => !teach.includes(w))).slice(0, 2)));
  return { teach, battles };
}
async function startSession(who) {
  const id = ++flow; pend = null; stopTimers();
  S.last = who; save();
  G = Object.assign({ who, cuts:0, esc:0, earned:0, learnedNow:[], album:[], hintUsed:false, streak:0 }, buildSession(who));
  $('#logo').hidden = true; updateHUD(); setPlayerKite(who);
  preload([MITHU.kemcho, MITHU.chalo, MITHU.teach, MITHU.again, MITHU.kaipo, MITHU.vaah, who === 'little' ? MITHU.majama : GREET_BIG, ESCAPE].concat(TAUNTS,
    G.teach.map(t => who === 'big' ? t.a : t), ...G.battles.map(b => who === 'big' ? [b.q, b.a] : [b])));
  if (rival) { rival.mode = 'escape'; rival.vx = 60; rival.vy = -40; }
  battle.crossing = false; player.grounded = true; player.spd = 5; aimKites(false);
  // 1. greeting (inside the tap, so the voice is allowed to play); saved voices are known first
  await ownReady; if (!alive(id)) return;
  mithuSays(MITHU.kemcho, 2800);
  showGreet(who);
  await until('correct'); if (!alive(id)) return;
  hideCard(); SFX.chime(); M.flap = 1.2; M.hop = 1; confetti(L.mithu.x, L.mithu.y - L.mithu.s, 18);
  player.grounded = false; player.spd = 1.4; aimKites(false); SFX.whoosh();
  mithuSays(MITHU.chalo, 1600);
  await sleep(1700); if (!alive(id)) return;
  // 2. teach Mithu
  for (let i = 0; i < G.teach.length; i++) {
    const it = G.teach[i];
    showTeach(it, i);
    if (i === 0) mithuSays(MITHU.teach, 1800); else speak(G.who === 'big' ? it.a : it, 'guide');
    await until('correct'); if (!alive(id)) return;
    const line = G.who === 'big' ? it.a : it;
    const Fy = F(); if (!Fy.learned.includes(it.id)) Fy.learned.push(it.id); G.learnedNow.push(it.id); save();
    hideCard(); SFX.chime(); M.flap = 1.3; M.hop = 1; feathers(L.mithu.x, L.mithu.y - L.mithu.s * 0.9, REDUCED ? 3 : 9);
    mithuSays(line, 2200); toast('Mithu learned ' + line.roman.replace(/[!?…]+$/, '') + '!');
    await sleep(1700); if (!alive(id)) return;
  }
  // 3. battles
  const Fy = F();
  for (let i = 0; i < G.battles.length; i++) {
    const it = G.battles[i], rv = RIVALS[(Fy.sessions * 3 + i) % RIVALS.length];
    spawnRival(rv); SFX.whoosh();
    await sleep(1000); if (!alive(id)) return;
    rivalSays(G.who === 'little' ? TAUNTS[1] : TAUNTS[i % TAUNTS.length], 2200);
    await sleep(1300); if (!alive(id)) return;
    battle.crossing = true; player.spd = 2.2; if (rival) rival.spd = 2.2; aimKites(false); SFX.tension();
    await sleep(1000); if (!alive(id)) return;
    G.hintUsed = false;
    showBattle(it, i, rv);
    startTimer(id, 30);
    if (G.who === 'big') speak(it.q, 'rival');
    const r = await until(['correct', 'timeout']); if (!alive(id)) return;
    stopTimers();
    const lastOne = i === G.battles.length - 1;
    if (r.name === 'correct') {
      // the pull gets its own 30-second clock, with the same Jaldi and countdown
      showPull();
      startTimer(id, 30);
      const p = await until(['pulled', 'timeout']); if (!alive(id)) return;
      stopTimers();
      if (p.name === 'pulled') {
        const gain = cutRival(rv);
        await sleep(1500); if (!alive(id)) return;
        showCut(rv, gain, lastOne);
      } else if (!(await kiteEscapes(id, rv, lastOne))) return;
    } else if (!(await kiteEscapes(id, rv, lastOne))) return;
    await until('next'); if (!alive(id)) return;
    hideCard(); battle.crossing = false; player.spd = 1.8; aimKites(false);
    await sleep(500); if (!alive(id)) return;
  }

}

  { const tc = $('#tcount'); if (tc) tc.textContent = guDigits(lastLeft); }   // the seconds show from the start

    '<div class="set"><div class="sl">Word pack</div><div class="weeks">' + WEEKS.map(w => '<button class="wk ' + (S.week === w.week ? 'sel' : '') + '" data-act="week" data-w="' + w.week + '" aria-pressed="' + (S.week === w.week) + '"><b>Week ' + w.week + '</b><span>' + w.theme + '</span></button>').join('') + '</div></div>' +
    '<div class="set"><div class="sl">Your voice</div><p class="note">Read the game’s lines once and the kids hear you instead of a computer voice: Mithu, the guide and the rival kites all speak like you. ' +
      (OWN.family.size ? OWN.family.size + ' line' + (OWN.family.size === 1 ? '' : 's') + ' recorded so far.' : 'Nothing recorded yet.') + '</p>' +
    '<button class="btn block" data-act="voice" style="margin-top:10px">' + MIC_SVG + 'Read the lines</button>' +
    '<div class="row" style="margin-top:10px"><button class="btn white sm" data-act="savevoice"' + (OWN.family.size ? '' : ' disabled') + '>Save to a file</button><button class="btn white sm" data-act="loadvoice">Load a file</button></div>' +
    '<p class="sub" style="margin:8px 0 0">Recordings live on this device. Save them to a file as a backup, or to load your voice onto the kids’ tablet.</p></div>' +
    '<div class="set row"><div><div class="sl">Mithu’s parrot squeak</div><div class="sv2">On: Mithu says your lines faster and higher, like a parrot. Off: he sounds just like you.</div></div>' +
      '<button class="btn sm ' + (S.squeak !== false ? 'leelo' : 'white') + '" data-act="squeak" aria-pressed="' + (S.squeak !== false) + '">' + (S.squeak !== false ? 'On' : 'Off') + '</button></div>' +
    '<div class="set row"><div><div class="sl">What plays now</div><div class="sv2">' + esc(voiceStatus()) + '</div></div><button class="btn white sm" data-act="test">Test</button></div>' +
    '<div class="set row"><div><div class="sl">Mithu listens in lessons</div><div class="sv2">He picks up each word your child says and keeps it when you tap Yes. Nothing leaves this device.</div></div>' +
      '<button class="btn sm ' + (S.listen !== false ? 'leelo' : 'white') + '" data-act="listen" aria-pressed="' + (S.listen !== false) + '">' + (S.listen !== false ? 'On' : 'Off') + '</button></div>' +
    '<div class="set row"><div><div class="sl">Recordings on this device</div><div class="sv2">' + esc(recSummary()) + '</div></div>' +
      (OWN.little.size + OWN.big.size + OWN.family.size ? '<button class="btn white sm" data-act="delrec">Delete all</button>' : '') + '</div>' +
    '<div class="set row"><div><div class="sl">Grown-up PIN</div><div class="sv2">Opens this screen and confirms missions.</div></div><button class="btn white sm" data-act="pin">Change</button></div>' +
    '<div class="set"><div class="sl">How it works</div><p class="note">Kids say every word out loud. You tap Yes or Again, so the game never marks their speech itself.</p></div>' +
    '<div class="stack"><button class="btn white block" data-act="reset">Reset progress</button><button class="btn rani block" data-act="close">Done</button></div>' +
    '<p class="sub center" style="margin:12px 0 0">Patang version ' + APP_VERSION + '</p>',
    { week: b => { S.week = +b.dataset.w; save(); SFX.pop(); openGrownups(); },
      test: () => { if (!S.sound) { toast('Sound is off'); return; } mithuSays(MITHU.kemcho, 2000); },
      voice: () => openSheets(),
      savevoice: () => exportVoice(), loadvoice: () => importVoice(),
      squeak: () => { S.squeak = S.squeak === false; save(); SFX.pop(); openGrownups(); },
      pin: () => pinSetup(openGrownups, openGrownups),
      listen: () => { S.listen = S.listen === false; save(); SFX.pop(); openGrownups(); },
      delrec: b => { if (b.dataset.armed) { dropAllOwn(); toast('Recordings deleted'); openGrownups(); return; } b.dataset.armed = '1'; b.textContent = 'Tap again'; b.classList.add('rani'); b.classList.remove('white'); },
      reset: b => { if (!armed) { armed = true; b.textContent = 'Tap again to reset everything'; b.classList.add('rani'); b.classList.remove('white'); return; } const keep = { sound:S.sound, week:S.week, pin:S.pin, listen:S.listen, squeak:S.squeak }; S = defaults(); Object.assign(S, keep); save(); toast('Progress reset'); goTitle(); },
      close: () => goTitle() });
}

// ---------- read-through: a grown-up reads every line once, hands-free ----------
// One line at a time, shown large. The mic opens once the game is quiet, catches the line and saves it as the
// grown-up's voice, which then plays for the guide, the rivals and (unless a child's own take exists) Mithu.
// The take plays back while the next line comes up, then the mic listens again. Back redoes a line, Skip moves on.
// The screen updates in place, so only leaving it (any other card) stops the listening.
let RT = null;
function rtStop() { if (RT) { RT.tok++; RT.on = false; } }
function rtLab(text, on) {
  const l = $('#rtLab'), b = dock.querySelector('[data-act=rtmic]'); if (l) l.textContent = text;
  if (b) { b.classList.toggle('on', !!on); if (!on) b.style.setProperty('--lv', '0'); }
}
function rtShow() {
  if (!RT || !$('#rtGu')) return;
  const l = RT.lines[RT.i], n = RT.lines.length, done = RT.lines.filter(lineHas).length;
  $('#rtCount').textContent = 'Line ' + (RT.i + 1) + ' of ' + n;
  $('#rtTitle').textContent = l.sheet || '';
  $('#rtGu').textContent = l.gu; $('#rtRo').textContent = cap(l.roman);
  $('#rtBar').style.width = Math.round(done / n * 100) + '%';
  $('#rtDone').textContent = done + ' of ' + n + ' in your voice';
}
function openReadThrough(lines) {
  RT = { lines, i: Math.max(0, lines.findIndex(l => !lineHas(l))), on: false, tok: 0 };
  showCard('<div class="headrow"><h2 class="say">Read aloud</h2><span class="sub" id="rtCount"></span></div>' +
    '<div class="sheetname" id="rtTitle"></div>' +
    '<div class="rtbar" aria-hidden="true"><i id="rtBar"></i></div>' +
    '<div class="word"><div class="txt"><div class="big-gu gu" id="rtGu"></div><div class="roman lg" id="rtRo"></div></div>' +
    '<button class="hear" data-act="rtplay" aria-label="Play my recording of this line">' + SPEAKER + '</button></div>' +
    '<div class="microw lsn"><button class="mic" data-act="rtmic" aria-label="Pause or carry on">' + MIC_SVG + '</button><span class="miclab" id="rtLab"></span></div>' +
    '<div class="row center" style="margin-top:10px"><button class="btn white sm" data-act="rtback">◀ Back</button><button class="btn white sm" data-act="rtskip">Skip ▶</button></div>' +
    '<p class="sub center" style="margin:10px 0 0">Read each line when it appears. It saves itself, plays back, and the next line comes up. <b id="rtDone"></b></p>' +
    '<button class="btn rani block" data-act="rtdone" style="margin-top:12px">Done</button>',
    { rtplay: () => { const l = RT && RT.lines[RT.i]; if (l && lineHas(l)) { rtPause(); speak(l, 'guide'); } else toast('Not recorded yet'); },
      rtmic: () => { if (RT.on) rtPause(); else rtResume(); },
      rtback: () => { if (RT.i > 0) { RT.i--; rtShow(); rtResume(); } },
      rtskip: () => { if (RT.i < RT.lines.length - 1) { RT.i++; rtShow(); rtResume(); } else rtFinish(); },
      rtdone: () => { rtStop(); RT = null; openSheets(); } });
  rtShow();
  if (micReady()) rtResume(); else rtLab(MIC_TEXT[MIC.ok ? 'policy' : 'none'], false);
}
function rtPause() { if (!RT) return; RT.tok++; RT.on = false; if (MIC.busy) MIC.busy.stop(); rtLab('Paused. Tap the mic to carry on.', false); }
function rtResume() {
  if (!RT) return;
  if (!MIC.ok) { rtLab(MIC_TEXT.none, false); return; }
  if (MIC.why === 'denied') MIC.why = '';
  if (MIC.busy) MIC.busy.stop();
  RT.on = true; rtLoop(++RT.tok);
}
function rtFinish() {
  if (!RT) return;
  RT.tok++; RT.on = false; rtShow();
  rtLab('All done! Tap Back to redo any line, or Done.', false);
  SFX.fanfare(); confetti(W / 2, H * 0.3, 60);
}
async function rtLoop(tok) {
  const live = () => RT && tok === RT.tok;
  await sleep(350);
  while (live()) {
    if (gameTalking()) { rtLab('Listen…', false); await sleep(150); continue; }
    if (MIC.busy || MIC.starting) { await sleep(150); continue; }
    rtLab('Listening… read it now', true);
    let blob = null;
    try {
      MIC.starting = true;
      const b = dock.querySelector('[data-act=rtmic]');
      blob = await recordOnce(lv => { if (b) b.style.setProperty('--lv', lv.toFixed(2)); }, { maxMs: 10000, idleMs: 20000, abort: () => !live() || gameTalking() });
    } catch (e) {
      MIC.starting = false; micDenied(e);
      if (live()) { RT.on = false; rtLab(MIC_TEXT[MIC.why] || MIC_TEXT.failed, false); }
      return;
    }
    if (!live()) return;
    if (!blob) {                               // the game spoke (try again), or nobody read for a while (pause)
      if (gameTalking()) continue;
      RT.on = false; rtLab('Paused. Tap the mic to carry on.', false); return;
    }
    const clip = await blobToClip(blob);
    if (!live()) return;
    if (!clip) { rtLab('Didn’t catch that. Read it again.', false); await sleep(900); continue; }
    saveOwn('family', RT.lines[RT.i].key, clip);
    stopVoice(); playBufs([clip], 'guide');    // hear it back while the next line comes up
    if (RT.i >= RT.lines.length - 1) { rtFinish(); return; }
    RT.i++; rtShow();
  }
}
const allLines = () => allSheets().flatMap(sh => sh.lines.map(l => Object.assign({ sheet: sh.name }, l)));
const sheetLines = i => allSheets()[i].lines.map(l => Object.assign({ sheet: allSheets()[i].name }, l));

// ---------- your voice as a file: a backup, and the way to put it on another device ----------
function abToB64(ab) { const u = new Uint8Array(ab); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function b64ToAb(b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
async function exportVoice() {
  const keys = [...OWN.family]; if (!keys.length) { toast('No grown-up recordings yet'); return; }
  const out = { app: 'patang', kind: 'voice', v: 1, saved: new Date().toISOString(), clips: {} };
  for (const k of keys) {
    try {
      const rec = await idbDo('readonly', st => st.get('family|' + k)); if (!rec) continue;
      const ab = rec.ab || (rec.blob ? await rec.blob.arrayBuffer() : null); if (!ab) continue;
      out.clips[k] = { type: rec.type || (rec.blob && rec.blob.type) || 'audio/webm', start: rec.start || 0, end: rec.end || 0, b64: abToB64(ab) };
    } catch (e) {}
  }
  const n = Object.keys(out.clips).length;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], { type: 'application/json' }));
  a.download = 'patang-my-voice.json'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  toast('Saved ' + n + ' line' + (n === 1 ? '' : 's') + ' to a file');
}
function importVoice() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    if (f.size > 40 * 1024 * 1024) { toast('That file is too big'); return; }
    try {
      const j = JSON.parse(await f.text());
      if (!j || j.app !== 'patang' || j.kind !== 'voice' || !j.clips || typeof j.clips !== 'object') throw new Error('not a voice file');
      let n = 0;
      for (const [k, c] of Object.entries(j.clips)) {
        if (!k || k.includes('|') || !c || typeof c.b64 !== 'string' || !/^audio\//.test(String(c.type || ''))) continue;
        const rec = { ab: b64ToAb(c.b64), type: c.type, start: +c.start || 0, end: +c.end || 0, at: Date.now() };
        await idbDo('readwrite', st => st.put(rec, 'family|' + k));
        OWN.family.add(k); clipBufs.delete('family|' + k); n++;
      }
      toast(n ? 'Loaded ' + n + ' line' + (n === 1 ? '' : 's') + ' in your voice' : 'No lines found in that file');
      openGrownups();
    } catch (e) { toast('That isn’t a Patang voice file'); }
  };
  inp.click();
}

// ---------- recording sheets ----------
let SHEETS = null;
const allSheets = () => SHEETS || (SHEETS = buildSheets());
const lineHas = l => !!VMAP[l.key] || OWN.family.has(l.key);
const sheetDone = sh => sh.lines.filter(lineHas).length;
function recSummary() {
  const kids = OWN.little.size + OWN.big.size, fam = OWN.family.size;
  return (kids || fam ? 'Mithu: ' + kids + ' · Grown-up: ' + fam + '. ' : 'None yet. ') + 'Nothing leaves this device.';
}
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
function openSheets() {
  const all = allSheets(), total = all.reduce((n, sh) => n + sh.lines.length, 0), have = all.reduce((n, sh) => n + sheetDone(sh), 0);
  showCard('<div class="headrow"><h2 class="say">Recording sheets</h2><button class="round" data-act="back" aria-label="Back">' + CLOSE_SVG + '</button></div>' +
    '<p class="tip" style="margin-top:0">' + have + ' of ' + total + ' lines are in your voice. Read them once and Mithu, the guide and the rival kites all speak like you.</p>' +
    (micReady() ? '<button class="btn rani block" data-act="readall" style="margin:4px 0 12px">' + MIC_SVG + (have ? 'Carry on reading (' + (total - have) + ' left)' : 'Read all ' + total + ' lines') + '</button>' +
        '<p class="sub" style="margin:0 0 10px">About 15 minutes. You can stop any time and carry on later. Recordings stay on this device; save them to a file in Grown-ups.</p>'
      : '<p class="tip">' + MIC_TEXT[MIC.ok ? 'policy' : 'none'] + '</p>') +
    '<div class="sheets">' + all.map((sh, i) => {
      const d = sheetDone(sh), n = sh.lines.length;
      return '<button class="sheet ' + (d === n ? 'full' : '') + '" data-act="open" data-i="' + i + '"><span class="sn">' + (i + 1) + '</span><span class="st"><b>' + esc(sh.name) + '</b><span>' +
        (d === n ? 'All ' + n + ' lines recorded' : d ? d + ' of ' + n + ' lines recorded' : n + ' lines') + '</span></span></button>';
    }).join('') + '</div>' +
    '<button class="btn white block" data-act="back" style="margin-top:14px">Back</button>',
    { open: b => openSheet(+b.dataset.i), readall: () => openReadThrough(allLines()), back: () => openGrownups() });
}
function openSheet(i, keepScroll) {
  const all = allSheets(), sh = all[i], ready = micReady();
  const prevTop = keepScroll && dock.querySelector('.card') ? dock.querySelector('.card').scrollTop : 0;
  showCard('<div class="headrow"><h2 class="say">Sheet ' + (i + 1) + '</h2><span class="sub">' + sh.lines.length + ' lines</span></div>' +
    '<div class="sheetname">' + esc(sh.name) + '</div>' +
    (ready ? '<button class="btn rani block" data-act="readsheet" style="margin-top:10px">' + MIC_SVG + 'Read this sheet</button>' : '') +
    '<p class="tip">' + (ready ? 'Or tap the mic next to one line to record or redo just that line. Tap ▶ to check it.'
      : 'Read each line once, then pause for a slow count of two. Stumbled? Stop and start this sheet again.') + '</p>' +
    '<ol class="prompter">' + sh.lines.map((l, j) => '<li' + (lineHas(l) ? ' class="has"' : '') + '><span class="n">' + (j + 1) + '</span><span class="w"><span class="gu">' + esc(l.gu) + '</span><span class="r">' + esc(cap(l.roman)) + '</span></span>' +
      (lineHas(l) ? '<button class="hear sm" data-act="play" data-j="' + j + '" aria-label="Play your recording">' + SPEAKER + '</button>' : '') +
      '<button class="mic sm' + (ready ? '' : ' off') + '" data-act="rec" data-j="' + j + '" aria-label="Record line ' + (j + 1) + '">' + MIC_SVG + '</button></li>').join('') + '</ol>' +
    '<div class="row" style="margin-top:14px">' + (i > 0 ? '<button class="btn white sm" data-act="prev">Previous</button>' : '') + '<span style="flex:1"></span>' +
    (i < all.length - 1 ? '<button class="btn sm" data-act="next">Next sheet</button>' : '') + '</div>' +
    '<button class="btn white block" data-act="back" style="margin-top:12px">All sheets</button>',
    { play: b => speak(sh.lines[+b.dataset.j], 'guide'), readsheet: () => openReadThrough(sheetLines(i)),
      rec: b => { const l = sh.lines[+b.dataset.j]; micTap(b, clip => { saveOwn('family', l.key, clip); stopVoice(); playBufs([clip], 'guide'); openSheet(i, true); }, t => toast(t)); },
      prev: () => openSheet(i - 1), next: () => openSheet(i + 1), back: () => openSheets() });
  const c = dock.querySelector('.card'); if (c) c.scrollTop = prevTop;
}

// ---------- wiring ----------
homeBtn.addEventListener('click', () => { ac(); SFX.pop(); goTitle(); });
soundBtn.addEventListener('click', () => { S.sound = !S.sound; save(); if (S.sound) { ac(); SFX.pop(); } else { try { speechSynthesis.cancel(); } catch (e) {} } updateHUD(); });
gearBtn.addEventListener('click', () => { ac(); SFX.pop(); grownupGate(openGrownups, goTitle); });
cv.addEventListener('pointerdown', e => {
  if (player.mode === 'fly' && !player.grounded && player.loop <= 0 && Math.hypot(e.clientX - player.x, e.clientY - player.y) < player.s * 1.4) {
    ac(); player.loop = 1; SFX.whoosh(); sparks(player.x, player.y, 10); return;
  }
  const dx = e.clientX - L.mithu.x, dy = e.clientY - (L.mithu.y - L.mithu.s * 0.6);
  if (Math.hypot(dx, dy) < L.mithu.s * 0.75) { ac(); SFX.squawk(); M.flap = 1.2; M.hop = 1; feathers(L.mithu.x, L.mithu.y - L.mithu.s * 0.9, 3); mithuSays(pick(POKES), 1600); }
});
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { try { speechSynthesis.cancel(); } catch (e) {} } });

// A newer release on the server? Offer a one-tap reload rather than leaving an old copy running.
async function checkForUpdate() {
  try {
    const r = await fetch(location.href.split('#')[0], { cache: 'no-store' }); if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m || m[1] === APP_VERSION || $('#updateBtn')) return;
    const b = document.createElement('button'); b.id = 'updateBtn'; b.className = 'btn leelo updatebtn'; b.textContent = 'New version ready: tap to update';
    b.addEventListener('click', () => location.reload()); document.body.appendChild(b);
  } catch (e) {}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
loadVoiceMap();
ownReady = loadOwnClips();
micProbe();
layout();
setPlayerKite(S.last);
aimKites(true);
goTitle();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
